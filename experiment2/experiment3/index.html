
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get to Know Me</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Get to Know Me</h1>
        <p>Connect With Me - Personal Information Form</p>
    </header>

    <!-- Main Form Section -->
    <main>

        <form id="contactForm">

            <!-- Personal Details -->
            <fieldset>
                <legend>Personal Details</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <p>Gender:</p>

                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
            </fieldset>

            <!-- Contact Information -->
            <fieldset>
                <legend>Contact Information</legend>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter 10-digit phone number"
                       pattern="[0-9]{10}"
                       title="Enter a 10-digit phone number" required>

                <label for="city">City:</label>
                <input type="text" id="city" name="city"
                       placeholder="Enter your city" required>

                <label for="address">Address:</label>
                <textarea id="address" name="address"
                          placeholder="Enter your address" required></textarea>
            </fieldset>

            <!-- Professional and Academic Details -->
            <fieldset>
                <legend>Professional / Academic Details</legend>

                <label for="institution">Institution / Organization:</label>
                <input type="text" id="institution" name="institution"
                       placeholder="Enter institution name" required>

                <label for="designation">Designation:</label>
                <input type="text" id="designation" name="designation"
                       placeholder="Enter your designation" required>

                <label for="study">Area of Study:</label>
                <select id="study" name="study" required>
                    <option value="">Select your area</option>
                    <option value="CSE">Computer Science</option>
                    <option value="AIML">Artificial Intelligence</option>
                    <option value="IoT">Internet of Things</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="Other">Other</option>
                </select>
            </fieldset>

            <!-- Areas of Interest -->
            <fieldset>
                <legend>Areas of Interest</legend>

                <p>Select your interests:</p>

                <input type="checkbox" id="technology" name="interests" value="Technology">
                <label for="technology">Technology</label>

                <input type="checkbox" id="sports" name="interests" value="Sports">
                <label for="sports">Sports</label>

                <input type="checkbox" id="music" name="interests" value="Music">
                <label for="music">Music</label>

                <input type="checkbox" id="coding" name="interests" value="Coding">
                <label for="coding">Coding</label>

                <input type="checkbox" id="reading" name="interests" value="Reading">
                <label for="reading">Reading</label>

                <label for="skills">Skills:</label>
                <textarea id="skills" name="skills"
                          placeholder="Mention your skills"></textarea>
            </fieldset>

            <!-- Purpose of Contact -->
            <fieldset>
                <legend>Purpose of Contact</legend>

                <p>Why would you like to connect?</p>

                <input type="radio" id="collaboration" name="purpose"
                       value="Collaboration" required>
                <label for="collaboration">Collaboration</label>

                <input type="radio" id="project" name="purpose"
                       value="Project Discussion">
                <label for="project">Project Discussion</label>

                <input type="radio" id="networking" name="purpose"
                       value="Networking">
                <label for="networking">Networking</label>

                <input type="radio" id="enquiry" name="purpose"
                       value="General Enquiry">
                <label for="enquiry">General Enquiry</label>
            </fieldset>

            <!-- Additional Information -->
            <fieldset>
                <legend>Additional Information</legend>

                <label for="message">Message / Introduction:</label>
                <textarea id="message" name="message"
                          placeholder="Write something about yourself"
                          required></textarea>
            </fieldset>

            <!-- Submit and Reset Buttons -->
            <div class="buttons">
                <button type="submit">Submit Form</button>
                <button type="reset">Reset Form</button>
            </div>

            <!-- Success Message -->
            <p id="successMessage" role="status" aria-live="polite"></p>

        </form>

    </main>

    <!-- Footer Section -->
    <footer>
        <p>© 2026 Get to Know Me | Personal Website</p>
    </footer>

    <!-- JavaScript for Form Functionality -->
    <script>

        // Select Form and Success Message
        const form = document.getElementById("contactForm");
        const successMessage = document.getElementById("successMessage");

        // Submit Button Functionality
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            successMessage.textContent =
                "Thank you! Your form has been submitted successfully.";

            successMessage.style.display = "block";

            form.reset();
        });

        // Reset Button Functionality
        form.addEventListener("reset", function() {

            successMessage.textContent = "";
            successMessage.style.display = "none";

        });

    </script>

</body>
</html>
